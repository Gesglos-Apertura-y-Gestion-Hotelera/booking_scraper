name: Selenium Tests

on:
  workflow_dispatch:
    inputs:
      script_key:
        description: 'Script a ejecutar'
        required: true
        default: 'clientes_diario'
        type: choice
        options:
          - clientes_diario
          - clientes_prevision
          - competencia_diario
          - competencia_prevision
          - seguimiento_diario
          - personalizado
      sheet_data:
        description: 'Datos en JSON (ej: [{"hotel":"Hilton","ciudad":"Bogota"}])'
        required: true
        default: '[{"hotel":"sheraton","ciudad":"medellin"},{"hotel":"marriot","ciudad":"Bogota"}]'
        type: string
      check_in:
        description: 'Fecha check-in (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      check_out:
        description: 'Fecha check-out (YYYY-MM-DD)'
        required: false
        default: ''
        type: string

jobs:
  scrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}

      - name: Set default parameters for push events
        id: params
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "script_key=${{ inputs.script_key }}" >> $GITHUB_OUTPUT
            echo "sheet_data=${{ inputs.sheet_data }}" >> $GITHUB_OUTPUT
            echo "check_in=${{ inputs.check_in }}" >> $GITHUB_OUTPUT
            echo "check_out=${{ inputs.check_out }}" >> $GITHUB_OUTPUT
          else
            # Valores por defecto para push en testing/github o main
            echo "script_key=clientes_diario" >> $GITHUB_OUTPUT
            echo "sheet_data=[{'hotel':'Hotel Brisas La Gaviota Mariquit-Tolima','ciudad':'mariquita'},{'hotel':'Casa de la Cruz','ciudad':'Mariquita'}]" >> $GITHUB_OUTPUT
            echo "check_in=" >> $GITHUB_OUTPUT
            echo "check_out=" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: docker build -f dockerfile -t selenium-app .

      - name: Run scraper container
        env:
          SCRIPT_KEY: ${{ steps.params.outputs.script_key }}
          SHEET_DATA: ${{ steps.params.outputs.sheet_data }}
          CHECK_IN: ${{ steps.params.outputs.check_in }}
          CHECK_OUT: ${{ steps.params.outputs.check_out }}
        run: |
          docker run --shm-size=2gb \
            -e BOOKING_CURRENCY=COP \
            -e BOOKING_COUNTRY=co \
            -e SHEET_DATA="$SHEET_DATA" \
            -e SCRIPT_KEY="$SCRIPT_KEY" \
            -e CHECK_IN="$CHECK_IN" \
            -e CHECK_OUT="$CHECK_OUT" \
            selenium-app \
            "${{ steps.params.outputs.script_key }}" \
            "${{ steps.params.outputs.check_in }}" \
            "${{ steps.params.outputs.check_out }}"

      - name: Run container
        id: run-and-save-container
        run: |
          # Ejecutar y guardar ID
          CONTAINER_ID=$(docker run -d your-image)
          echo "container_id=$CONTAINER_ID" >> $GITHUB_OUTPUT
          
          # Esperar
          docker wait "$CONTAINER_ID"

      - name: Show logs
        if: always()
        run: |
          CONTAINER_ID=$(docker ps -lq)

          # Si no hay contenedores corriendo, buscar detenidos
          if [ -z "$CONTAINER_ID" ]; then
            CONTAINER_ID=$(docker ps -laq | head -1)
          fi

          # Mostrar logs si encontró algún contenedor
          if [ -n "$CONTAINER_ID" ]; then
            echo "📋 Logs del contenedor $CONTAINER_ID:"
            docker logs "$CONTAINER_ID"
          else
            echo "⚠️ No hay contenedores disponibles"
            docker ps -a
          fi
