name: Selenium CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: [actions/checkout](https://github.com)@v4

      - name: Configurar Python
        uses: [actions/setup-python](https://github.com)@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest  # Añade aquí tus librerías (o pip install -r requirements.txt)

      - name: Ejecutar Tests (Headless)
        run: pytest
        env:
          # Puedes pasar variables de entorno aquí si las necesitas
          CHROME_BIN: /usr/bin/google-chrome
